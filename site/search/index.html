<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | Okazuri BOT</title><meta name="description" content="Search the works of many sites at once"><meta name="color-scheme" content="dark">
<link rel="alternate" hreflang="ja" href="/ja/search"><link rel="alternate" hreflang="en" href="/search">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body><header class="nav"><div class="nav-in"><a class="brand" href="/">オカズリBOT</a>
<a class="link active" href="/search">Search</a><a class="link" href="/dev">API</a><span class="sp"></span>
<a class="lang" href="/ja/search" hreflang="ja">日本語</a>
<a class="btn primary" href="/add">Add</a></div></header><main><h1 style="margin-top:48px;font-size:32px">Search</h1><p class="note">Search in Japanese, romaji or English. Separate several words with spaces.</p>
<form class="sbox" id="f"><input id="q" placeholder="e.g. kairakuten 2026 11" autocomplete="off" autofocus><button class="btn primary">Search</button></form>
<div id="out"></div></main><footer>オカズリBOT ・ <a href="/invite">Support server</a> ・ <a href="/dev">API</a></footer><script>
const $=s=>document.querySelector(s),out=$('#out');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function run(q){
  if(!q.trim())return;
  history.replaceState(null,'','?q='+encodeURIComponent(q));
  out.innerHTML='<p class="note">Searching… (a new word takes a little while)</p>';
  try{
    const r=await fetch('/api/v1/okazuri/search?live=diff&q='+encodeURIComponent(q));
    const d=await r.json();
    if(!r.ok){out.innerHTML='<p class="note">'+esc(d.detail||'Error')+'</p>';return}
    const ja=/[\u3040-\u30ff\u3400-\u9fff]/.test(q);
    let h='<div class="lines">';
    if(ja&&d.query.replace(/\s+/g,' ')!==q.trim().toLowerCase())h+='<div>Romaji　<b>'+esc(d.query)+'</b></div>';
    if(d.translation?.text)h+='<div>English　<b>'+esc(d.translation.text)+'</b></div>';
    if(d.translationJa?.text)h+='<div>Japanese <b>'+esc(d.translationJa.text)+'</b></div>';
    const n=d.total;
    h+='<div>'+(n+' works')+(d.total>d.results.length?(function(n){return ' (first '+n+')'})(d.results.length):'')+'</div></div>';
    for(const [legal,label,color] of [[true,'Legal','var(--ok)'],[false,'Illegal','var(--ng)']]){
      const rs=d.results.filter(x=>x.isLegal===legal);
      if(!rs.length)continue;
      h+='<div class="group"><span class="dot" style="background:'+color+'"></span>'+label+'</div><div class="res">'+rs.map(x=>'<div class="item"><small>'+esc(x.website)+'</small><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></div>').join('')+'</div>';
    }
    if(!d.results.length)h+='<p class="note">Nothing found.</p>';
    h+='<div class="sites">'+(d.sites||[]).map(s=>'<span class="chip'+(s.status==='failed'?' bad':'')+'">'+esc(s.website)+' '+esc(s.status)+'</span>').join('')+'</div>';
    out.innerHTML=h;
  }catch(e){out.innerHTML='<p class="note">The request failed.</p>'}
}
$('#f').addEventListener('submit',e=>{e.preventDefault();run($('#q').value)});
const init=new URLSearchParams(location.search).get('q');if(init){$('#q').value=init;run(init)}
</script></body></html>
