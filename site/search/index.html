<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search | Okazuri BOT</title><meta name="description" content="Search the works of many sites at once"><meta name="color-scheme" content="dark">
<link rel="alternate" hreflang="ja" href="/ja/search"><link rel="alternate" hreflang="en" href="/search">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body><header class="nav"><div class="nav-in"><a class="brand" href="/">オカズリBOT</a>
<a class="link active" href="/search">Search</a><a class="link" href="/dev">API</a><span class="sp"></span>
<a class="lang" href="/ja/search" hreflang="ja">日本語</a>
<a class="btn primary" href="/bot/add">Add</a></div></header><main><h1 style="margin-top:48px;font-size:32px">Search</h1><p class="note">Search in Japanese, romaji or English. Separate several words with spaces.</p>
<form id="f"><div id="rows"></div><div class="sbox"><button type="button" class="btn" id="add">+ Add a field</button><button class="btn primary">Search</button></div>
<label class="note"><input type="checkbox" id="bm"> By magazine (find the issue that printed this work)</label></form>
<div id="out"></div></main><footer>オカズリBOT ・ <a href="/support/invite">Support server</a> ・ <a href="/dev">API</a></footer><script>
const $=s=>document.querySelector(s),out=$('#out'),rows=$('#rows');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addRow(v){
  const d=document.createElement('div');d.className='sbox';
  d.innerHTML='<input placeholder="e.g. kairakuten 2026 11" autocomplete="off"><button type="button" class="btn" title="Remove">×</button>';
  d.querySelector('input').value=v||'';
  d.querySelector('button').onclick=()=>{if(rows.children.length>1)d.remove();else d.querySelector('input').value=''};
  rows.append(d);return d;
}
$('#add').onclick=()=>addRow('').querySelector('input').focus();
async function one(q,bm){
  if(bm){
    const m=await fetch('/api/v1/okazuri/magazine?q='+encodeURIComponent(q)),md=await m.json();
    if(!m.ok)return '<p class="note">'+esc(md.detail||'Error')+'</p>';
    q=md.results[0].issue.name.replace(/年|月号?/g,' ');
  }
  const r=await fetch('/api/v1/okazuri/search?live=diff&q='+encodeURIComponent(q));
  const d=await r.json();
  if(!r.ok)return '<p class="note">'+esc(d.detail||'Error')+'</p>';
  const ja=/[぀-ヿ㐀-鿿]/.test(q);
  let h='<div class="lines">';
  if(ja&&d.query.replace(/\s+/g,' ')!==q.trim().toLowerCase())h+='<div>Romaji　<b>'+esc(d.query)+'</b></div>';
  if(d.translation?.text)h+='<div>English　<b>'+esc(d.translation.text)+'</b></div>';
  if(d.translation_ja?.text)h+='<div>Japanese <b>'+esc(d.translation_ja.text)+'</b></div>';
  const n=d.total;
  h+='<div>'+(n+' works')+(d.total>d.results.length?(function(n){return ' (first '+n+')'})(d.results.length):'')+'</div></div>';
  for(const [legal,label,color] of [[true,'Legal','var(--ok)'],[false,'Illegal','var(--ng)']]){
    const rs=d.results.filter(x=>x.is_legal===legal);
    if(!rs.length)continue;
    h+='<div class="group"><span class="dot" style="background:'+color+'"></span>'+label+'</div><div class="res">'+rs.map(x=>'<div class="item"><small>'+esc(x.website)+'</small><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></div>').join('')+'</div>';
  }
  if(!d.results.length)h+='<p class="note">Nothing found.</p>';
  h+='<div class="sites">'+(d.sites||[]).map(s=>'<span class="chip'+(s.status==='failed'?' bad':'')+'">'+esc(s.website)+' '+esc(s.status)+'</span>').join('')+'</div>';
  return h;
}
async function run(){
  const qs=[...rows.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean),bm=$('#bm').checked;
  if(!qs.length)return;
  history.replaceState(null,'','#'+qs.map(q=>'q='+encodeURIComponent(q)).join('&')+'&by_magazine='+bm);
  out.innerHTML='<p class="note">Searching… (a new word takes a little while)</p>';
  const parts=await Promise.all(qs.map(q=>one(q,bm).catch(()=>'<p class="note">The request failed.</p>')));
  out.innerHTML=parts.map((h,i)=>'<section class="query">'+(qs.length>1?'<h2 class="sec">'+esc(qs[i])+'</h2>':'')+h+'</section>').join('');
}
$('#f').addEventListener('submit',e=>{e.preventDefault();run()});
const hash=new URLSearchParams(location.hash.slice(1)),init=hash.getAll('q').filter(Boolean);
if(!init.length){const o=new URLSearchParams(location.search).get('q');if(o)init.push(o)}
if(hash.get('by_magazine')==='true')$('#bm').checked=true;
(init.length?init:['']).forEach(addRow);
if(init.length)run();
</script></body></html>
